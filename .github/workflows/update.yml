name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: '17 * * * *'   # Reserve, stündlich. GitHub startet geplante Läufe oft verspätet oder gar nicht.
  # Den eigentlichen Takt gibt der Pi vor: wow-anstossen.timer in pi-homeserver stößt alle 5 Minuten an.
  workflow_dispatch:        # Button "Run workflow" für sofortige Aktualisierung, auch der Anstoß vom Pi
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read   # deploy-pages ab v4 liest damit das Artefakt des Laufs

concurrency:
  group: pages
  cancel-in-progress: false

# Alle Actions laufen mit Node 24. Der Runner ist fest auf Ubuntu 24.04: ubuntu-latest wechselt ab Oktober 2026 auf Ubuntu 26,
# und „playwright install --with-deps“ (3D-Spiegelung) braucht eine Version, die Playwright kennt. Umstellen erst nach einem Testlauf.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # sharp wandelt die 2D-Renders in WebP um (fetch.mjs), Playwright spiegelt die 3D-Modelle.
      - name: Pakete installieren
        run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      - name: Charakterdaten abrufen
        run: node scripts/fetch.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data.json

      # Der 3D-Stand (Aussehen, Items, Animationen) ändert sich selten. Bleibt er gleich,
      # kommen die Dateien aus dem Cache und Browser-Installation und Spiegelung entfallen.
      # Das 6-Stunden-Fenster im Schlüssel sorgt dafür, dass ein neuer Versuch (fehlende Dateien) im Cache landet.
      - name: 3D-Stand prüfen
        id: models
        run: |
          echo "hash=$(node scripts/mirror-models.mjs --hash)" >> "$GITHUB_OUTPUT"
          echo "window=$(node scripts/mirror-models.mjs --window)" >> "$GITHUB_OUTPUT"

      - name: 3D-Cache laden
        uses: actions/cache@v6
        with:
          path: .model-cache
          key: models-${{ steps.models.outputs.hash }}-${{ steps.models.outputs.window }}
          restore-keys: |
            models-${{ steps.models.outputs.hash }}-
            models-

      - name: 3D-Dateien aus dem Cache übernehmen
        id: restore
        continue-on-error: true
        run: node scripts/mirror-models.mjs --restore

      - name: 3D-Modelle spiegeln
        if: steps.restore.outputs.restored != 'true'
        continue-on-error: true   # ohne 3D zeigt die Seite die 2D-Renders
        run: |
          npx playwright install --with-deps chromium
          node scripts/mirror-models.mjs

      - name: Verlauf committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Verlauf aktualisieren"
          # Kam während des Laufs ein anderer Commit auf main (z. B. ein Code-Push), lehnt GitHub den Push ab.
          # Dann den Verlauf auf den neuen Stand setzen und erneut pushen.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages lehnt ein Deployment manchmal ab, solange es das vorige intern noch verarbeitet
      # („due to in progress deployment“, meist beim ersten Lauf nach einem neuen Commit). Dann nach einer Minute erneut.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Warten vor neuem Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
