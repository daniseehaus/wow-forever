name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: '17 * * * *'   # stündlich (GitHub startet oft etwas verspätet)
  workflow_dispatch:        # Button "Run workflow" für sofortige Aktualisierung
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Charakterdaten abrufen
        run: node scripts/fetch.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data.json

      - name: 3D-Cache laden
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: 3D-Modelle spiegeln
        continue-on-error: true   # ohne 3D zeigt die Seite die 2D-Renders
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/mirror-models.mjs

      - name: Verlauf committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/sessions.json
          git diff --cached --quiet || (git commit -m "Verlauf aktualisieren" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
